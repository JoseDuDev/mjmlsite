# Cabeçalhos de segurança — incluídos em TODO bloco `location` que usa
# `add_header`.
#
# Motivo: no nginx, `add_header` num nível descarta todos os `add_header`
# herdados do nível acima. Basta um `add_header Cache-Control` dentro de um
# `location` para a resposta sair sem CSP, sem X-Frame-Options e sem nosniff —
# silenciosamente, sem erro nenhum. Por isso os cabeçalhos moram aqui e são
# reincluídos em cada bloco, em vez de declarados uma vez no `server`.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;

# CSP restritiva: o site é estático e não carrega NADA de terceiro. Os estilos
# ficam inline por causa dos <style> com escopo do Astro, e o script do menu
# mobile é inlinado pelo Astro no HTML — daí o 'unsafe-inline' nos dois.
#
# Ao adicionar Google Analytics, pixel de anúncio ou qualquer script externo, é
# ESTA linha que precisa mudar — de propósito. A restrição serve de lembrete de
# que a política de privacidade e o aviso de cookies também precisam mudar.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self' https:; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
