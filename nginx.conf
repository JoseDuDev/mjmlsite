# ── www → apex ───────────────────────────────────────────────────────────────
# O canonical das páginas aponta para https://mjml.com.br (sem www), então o www
# precisa redirecionar — dois endereços servindo o mesmo conteúdo dividem
# autoridade no Google e confundem métrica.
#
# Feito aqui, e não em label do Traefik, de propósito: o Coolify gera as labels
# de roteamento sozinho a partir dos domínios cadastrados na UI, e enfiar um
# middleware num router de nome gerado é frágil — quebra em qualquer upgrade.
# O nginx enxerga o Host que o Traefik encaminha, então resolve sem depender de
# nada externo. `https://` fixo porque quem termina o TLS é o Traefik: aqui a
# requisição sempre chega em HTTP.
server {
    listen 80;
    server_name www.mjml.com.br;
    return 301 https://mjml.com.br$request_uri;
}

# ── Site ─────────────────────────────────────────────────────────────────────
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sem isso o nginx redireciona /contato para http://localhost:80/contato/ —
    # a porta interna vaza na URL do visitante.
    absolute_redirect off;

    # Quem responde por HSTS e pelo redirect 80→443 é o Traefik do Coolify, que
    # termina o TLS. Aqui a requisição chega sempre em HTTP.
    server_tokens off;

    # ── Compressão ───────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Cache ────────────────────────────────────────────────────────────────
    # Sem `expires` em lugar nenhum: essa diretiva emite o próprio
    # `Cache-Control: max-age=...`, que somado ao `add_header` resulta em DOIS
    # cabeçalhos Cache-Control na mesma resposta.
    #
    # Todo bloco abaixo reinclui security-headers.conf — ver o comentário lá
    # sobre a herança de `add_header` no nginx.

    # Assets em /_astro/ têm hash no nome: mudou o conteúdo, mudou a URL.
    # Podem ser cacheados para sempre com segurança.
    location /_astro/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location ~* \.(?:woff2|woff|ttf|otf)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
    }

    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    location = /sitemap.xml {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /robots.txt {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # ── Rotas ────────────────────────────────────────────────────────────────
    # O Astro gera /contato/index.html, mas os links internos e o canonical
    # apontam para /contato, SEM barra final.
    #
    # `$uri/index.html` ANTES de `$uri/` é o que importa: com `$uri/`, o nginx
    # detecta o diretório e devolve 301 para /contato/ — um round-trip extra em
    # toda navegação, que a 200 ms de latência da VPS é bem sentido. Servindo o
    # index.html direto, a resposta é 200 na primeira tentativa.
    #
    # `$uri/` fica no fim como rede de segurança para quem digitar a barra.
    #
    # O `no-cache` mora aqui e não num `location ~* \.html$`: as páginas são
    # servidas como /contato, sem extensão, então um regex de .html nunca casa e
    # o HTML sairia sem política de cache — um deploy podia demorar a aparecer
    # para quem já visitou. Os blocos de asset acima têm precedência sobre este,
    # então continuam com cache longo.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Endpoint interno de healthcheck — não aparece no access log.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
